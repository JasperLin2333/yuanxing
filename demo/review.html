<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>元形工作台</title><link rel="icon" href="data:,"><style>/* 工作台外壳样式；原型内容、节点尺寸及编排由各自来源维护。 */
:root{
  --green:#00B831;--green-hover:#00C735;--green-press:#00A82D;
  --ink:#141414;--muted:#6C737B;--subtle:#93959E;--disabled:#B9BAC0;
  --line:#EBEDF0;--border:#D7D9DB;--soft:#F6F8FA;--hover:#F3F3F6;
  --active:#EBEBF0;--selected:#EAF8EE;--selected-ink:#07862A;--blue:#33508F;--danger:#FF534E;
  --wire-color:#93959E;--surface:#FFFFFF;--radius:2px;--toolbar-height:52px;
  --floating-shadow:0 4px 12px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;color:var(--ink);background:var(--surface);font:400 13px/1.5 'PingFang SC','Microsoft YaHei','Helvetica Neue','Arial',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
strong,b{font-weight:600}
button,summary{cursor:pointer}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;padding:5px 12px;border:1px solid transparent;border-radius:var(--radius);background:transparent;color:inherit;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s}
button:hover,summary:hover{background:var(--hover)}
button:active,summary:active{background:var(--active)}
button:disabled{color:var(--disabled);cursor:default;background:transparent}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button.primary{background:var(--green);color:white}
button.primary:hover{background:var(--green-hover)}
button.primary:active{background:var(--green-press)}
button svg{flex:none}
.spacer{flex:1;min-width:8px}
.danger{color:var(--danger)}
:where(#sidebar,#inspector,#page-viewport,.rich-editor,.annotation-editor textarea){scrollbar-width:thin;scrollbar-color:#D3DAE0 transparent}
:where(#sidebar,#inspector,#page-viewport,.rich-editor,.annotation-editor textarea)::-webkit-scrollbar{width:8px;height:8px}
:where(#sidebar,#inspector,#page-viewport,.rich-editor,.annotation-editor textarea)::-webkit-scrollbar-thumb{background:#D3DAE0;border:2px solid white;border-radius:4px}

/* 顶栏与三栏布局。 */
.toolbar{position:relative;z-index:30;display:flex;align-items:center;gap:12px;height:var(--toolbar-height);padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.toolbar #project-title{max-width:28%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-weight:600;line-height:1.4}
.toolbar #module-title{display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.toolbar #module-title:not(:empty)::before{content:'/';color:var(--border)}
#edit-tools{display:flex;align-items:center;gap:4px;padding-right:12px;border-right:1px solid var(--line)}
.panel-toggle,#edit-tools .tool-icon,#inspector .tool-icon{display:grid;place-items:center;flex:none;width:32px;height:32px;min-height:32px;padding:6px;color:var(--muted)}
.panel-toggle[aria-expanded="false"]{background:var(--hover);color:var(--ink)}
#inspector .tool-icon.danger{color:var(--danger)}
#edit-tools .tool-icon:disabled,#inspector .tool-icon:disabled{color:var(--disabled);background:transparent}
#export-trigger{height:32px;background:var(--green);color:white;padding:5px 12px}
#export-trigger:hover{background:var(--green-hover)}
#export-trigger:active{background:var(--green-press)}
.layout{--sidebar-width:232px;--inspector-width:288px;display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr) var(--inspector-width);height:calc(100vh - var(--toolbar-height))}
.layout.sidebar-collapsed{--sidebar-width:0px}
.layout.inspector-collapsed{--inspector-width:0px}
#sidebar{grid-column:1;grid-row:1;min-width:0;overflow:auto;padding:16px 12px;border-right:1px solid var(--line);background:var(--surface)}
#workspace{position:relative;grid-column:2;grid-row:1;min-width:0;overflow:hidden;background:var(--soft)}
#inspector{grid-column:3;grid-row:1;min-width:0;overflow:auto;padding:16px;border-left:1px solid var(--line);background:var(--surface)}
#sidebar button{display:block;width:100%;text-align:left}
#sidebar .module{font-size:13px;font-weight:600}
#sidebar .module.active{color:var(--selected-ink);background:var(--selected)}
#sidebar .state{color:var(--muted);font-size:13px;white-space:normal}
#sidebar .state.active{color:var(--selected-ink);background:var(--selected)}
#sidebar .state-section{margin:16px 8px 8px;color:var(--muted);font-size:12px;font-weight:600}
#sidebar .add-module{position:sticky;top:0;z-index:2;margin-bottom:12px;border:1px solid var(--border);background:white;color:var(--green)}
#sidebar .add-module:hover{background:var(--selected)}

/* 字段与说明面板。 */
#inspector .inspector-header{position:sticky;top:-16px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin:-16px -16px 20px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
#inspector .inspector-header h2{min-width:0;margin:0;font-size:14px;font-weight:600}
#inspector h2{margin:0 0 16px;font-size:14px;font-weight:600}
#inspector h3{margin:24px 0 12px;font-size:14px;font-weight:600}
#inspector .hint,.missing,.field-label{font-size:12px;color:var(--muted)}
#inspector .edge-summary{margin:0 0 20px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--soft);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
#inspector .edge-summary span{padding:0 4px;color:var(--subtle)}
label{display:block;margin:0 0 16px;color:var(--muted);font-size:12px}
input,textarea,select{display:block;width:100%;min-height:32px;margin-top:8px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-size:13px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--subtle)}
input:hover,textarea:hover,select:hover{border-color:var(--subtle)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--selected);outline-offset:1px;border-color:var(--green)}
input:not([type="range"]),select{height:32px}
textarea{min-height:112px;resize:vertical}
.description-field{margin:0 0 16px}
.field-label{display:block}
.rich-editor{min-height:160px;max-height:480px;overflow:auto;margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.rich-editor:focus{outline:2px solid var(--selected);outline-offset:1px;border-color:var(--green)}
.rich-editor:empty::before{content:attr(data-placeholder);color:var(--subtle);pointer-events:none}
.rich-editor p:first-child{margin-top:0}
.rich-editor p:last-child{margin-bottom:0}
.description-field .hint{margin:8px 0}
.image-uploading{display:inline-block;padding:4px 8px;border-radius:var(--radius);color:var(--muted);background:var(--soft);font-size:12px}
.missing,.missing-image{color:var(--danger)}
.loading-placeholder{padding:48px;color:var(--muted)}
.markdown{font-size:13px;line-height:1.5}
.markdown p{margin:8px 0;overflow-wrap:anywhere}
.markdown ul{padding-left:20px}
.markdown strong{font-weight:600}
.markdown code{padding:2px 4px;border-radius:var(--radius);background:var(--hover)}
.markdown table{width:100%;border-collapse:collapse;font-size:13px}
.markdown td,.markdown th{padding:8px;border:1px solid var(--line);text-align:left}
.markdown th{font-weight:600;background:var(--soft)}
.markdown img{display:block;position:static!important;width:auto!important;height:auto!important;max-width:100%;margin:12px 0;object-fit:contain}
.outgoing{display:block;width:100%;text-align:left;white-space:normal;color:var(--blue)}
.context-tool-group{margin:0 0 16px}
.context-tool-label{display:block;margin-bottom:8px;color:var(--muted);font-size:12px}
.context-tools{display:grid;grid-template-columns:repeat(4,32px);gap:4px;width:max-content;max-width:100%;padding:4px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.context-tools.align-tools{grid-template-columns:repeat(3,32px)}
.context-tools.distribute-tools{grid-template-columns:repeat(2,32px)}

/* 画布、卡片及连接点。卡片宽高由统一几何函数设置。 */
#canvas-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:var(--soft);background-image:radial-gradient(var(--border) .8px,transparent .8px);background-size:20px 20px;outline:none}
#canvas-world{position:absolute;transform-origin:0 0}
#nodes{position:absolute;inset:0}
.node{position:absolute;width:400px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:visible;user-select:none}
.node:not(.branch){display:flex;flex-direction:column}
.node:hover{border-color:var(--subtle)}
.node.selected{border-color:var(--green);outline:2px solid var(--green);outline-offset:1px}
.node.reference{border-style:dashed}
.node-header{display:flex;align-items:center;flex:none;gap:8px;min-width:0;height:40px;padding:0 12px;border-radius:var(--radius) var(--radius) 0 0;cursor:grab;user-select:none;font-size:14px;font-weight:600}
.node-header>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-header .ref-label{flex:none;font-size:12px;font-weight:400;color:var(--muted)}
.node-thumb{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;border-top:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);background:var(--surface);cursor:pointer}
.node-thumb iframe,.page-frame{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
.node-thumb img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.note-preview{max-height:100%;overflow:hidden;padding:20px;color:#4A4F54;font-size:13px}
.node-port{position:absolute;z-index:6;width:18px;height:18px;min-height:0;padding:0;border:2px solid var(--green);border-radius:50%;background:white;cursor:crosshair;opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-50%) scale(var(--port-scale,1));touch-action:none;transition:opacity .12s}
.node-port[data-side="top"]{left:50%;top:0}
.node-port[data-side="right"]{left:100%;top:50%}
.node-port[data-side="bottom"]{left:50%;top:100%}
.node-port[data-side="left"]{left:0;top:50%}
.node.selected .node-port,.connecting .node.connection-target .node-port{opacity:1;visibility:visible;pointer-events:auto}
.node-port:hover,.node-port:focus-visible{background:var(--selected);outline:4px solid var(--selected)}
.node.connection-target{border-color:var(--green);outline:4px solid var(--selected)}
.connecting .node-thumb,.connecting .node-header{cursor:crosshair}
.node.branch{height:16px;border:2px solid var(--subtle);border-radius:50%;background:white}
.node.branch .node-header{width:12px;height:12px;padding:0;border-radius:50%}
.node.branch .node-header>span{display:none}
.node.branch.selected{border-color:var(--green);background:var(--selected)}
.node.branch .node-port[data-side="top"]{top:calc(-14px * var(--port-scale,1))}
.node.branch .node-port[data-side="bottom"]{top:calc(100% + 14px * var(--port-scale,1))}
.node.branch .node-port[data-side="left"]{left:calc(-14px * var(--port-scale,1))}
.node.branch .node-port[data-side="right"]{left:calc(100% + 14px * var(--port-scale,1))}
.node.branch::before{content:"";position:absolute;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%) scale(var(--port-scale,1));border-radius:50%;cursor:move}
.lines-hidden .node-port,.lines-hidden .node.branch,#canvas-world.multi-selecting .node-port{display:none!important}
#canvas-sections{position:absolute;inset:0;pointer-events:none}
.canvas-section{position:absolute;border:1px solid var(--border);border-radius:var(--radius);background:#FFFFFFA6;pointer-events:none}
.canvas-section>strong{display:block;padding:16px 24px;color:#4A4F54;font-size:16px;font-weight:600}

/* 连线与编辑控件。 */
#lines,#alignment-guides{position:absolute;width:12000px;height:24000px;overflow:visible;pointer-events:none}
#lines path.flow{fill:none;stroke:var(--wire-color);stroke-width:1.5;pointer-events:stroke;cursor:pointer;vector-effect:non-scaling-stroke}
#lines path.flow.selected{stroke:var(--green);stroke-width:2}
#lines path.flow,#lines .connection-preview{stroke-linejoin:round;stroke-linecap:round}
#lines path.flow-hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;vector-effect:non-scaling-stroke;cursor:pointer}
#lines .connection-preview{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:6 4;pointer-events:none;vector-effect:non-scaling-stroke}
#lines .label{font-size:12px;fill:var(--muted);cursor:pointer;pointer-events:all;paint-order:stroke;stroke:var(--soft);stroke-width:5px;stroke-linejoin:round}
#lines .edge-label{cursor:pointer;pointer-events:all}
#lines .edge-label rect{fill:var(--soft)}
#lines .label-leader{fill:none;stroke:var(--wire-color);stroke-width:1;pointer-events:none}
#lines .edge-endpoint{fill:white;stroke:var(--green);stroke-width:2;cursor:crosshair;pointer-events:all}
#lines .edge-bend{fill:white;stroke:var(--green);stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none;cursor:move}
#lines .edge-segment-hit{fill:none;stroke:transparent;stroke-width:16;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:move}
#lines .edge-segment-control:hover .edge-bend{opacity:1;pointer-events:all}
#lines .edge-fork-control{cursor:crosshair}
#lines .edge-fork-control:focus{outline:none}
#lines .edge-fork-control:focus .edge-fork{stroke:var(--green);stroke-width:4}
#lines .edge-fork{fill:var(--green);stroke:white;stroke-width:2;pointer-events:all;cursor:crosshair}
#lines .edge-fork-plus{fill:none;stroke:white;stroke-width:1.7;vector-effect:non-scaling-stroke;pointer-events:none}
#lines .edge-fork-hit{fill:transparent;cursor:crosshair;pointer-events:all}
#lines .edge-geometry-controls:hover .edge-fork{opacity:1;pointer-events:all}
#lines .edge-geometry-controls:hover .edge-fork-hit{pointer-events:all}
#lines .edge-label:active{cursor:move}
#lines .dimmed{opacity:.15}
#lines .flow-hit.dimmed{pointer-events:none}
#alignment-guides .alignment-guide{stroke:var(--green);stroke-width:1;stroke-dasharray:4 4;pointer-events:none;vector-effect:non-scaling-stroke}
#alignment-guides .selection-box{fill:var(--selected);fill-opacity:.6;stroke:var(--green);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}

/* 浮动工具条、缩放与菜单。 */
.zoom-tools{position:absolute;bottom:16px;left:16px;display:flex;align-items:center;gap:4px;max-width:calc(100% - 32px);padding:4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--floating-shadow)}
.zoom-tools>button,.zoom-tools .tool-icon{display:grid;place-items:center;flex:none;width:32px;height:32px;min-height:32px;padding:6px;color:var(--muted)}
.zoom-tools .danger{color:var(--danger)}
.zoom-tools .tool-divider{width:1px;min-width:1px;height:16px;margin:0 4px;background:var(--line)}
#zoom-label{display:block;width:76px;min-width:76px;height:32px;margin:0;padding:4px 8px;border:1px solid transparent;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
#zoom-label:hover{border-color:var(--border);background:var(--hover)}
.zoom-settings{position:relative}
.zoom-settings>summary{display:grid;place-items:center;width:32px;height:32px;padding:6px;list-style:none;border-radius:var(--radius);color:var(--muted)}
.zoom-settings>summary::-webkit-details-marker{display:none}
.zoom-settings[open]>summary{background:var(--selected);color:var(--green)}
.zoom-settings-panel{position:absolute;right:0;bottom:44px;width:248px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--floating-shadow)}
.zoom-settings-panel label{display:flex;justify-content:space-between;gap:8px;margin:0 0 16px;color:var(--ink)}
.zoom-settings-panel output{color:var(--muted);font-variant-numeric:tabular-nums}
.zoom-settings-panel input{width:100%;min-height:24px;margin:0;padding:0;accent-color:var(--green);border:0}
.lines-slash{display:none}
[data-action="toggle-lines"][aria-pressed="true"],[data-action="annotate"][aria-pressed="true"]{background:var(--selected);color:var(--green)}
[data-action="toggle-lines"][aria-pressed="true"] .lines-slash{display:block}
.dropdown{position:relative}
.chevron{display:inline-block;width:6px;height:6px;margin:0 2px 3px 4px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.dropdown-menu{position:absolute;z-index:40;min-width:200px;padding:4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--floating-shadow)}
.dropdown-menu button{display:flex;align-items:center;justify-content:flex-start;width:100%;min-height:32px;padding:6px 12px;text-align:left}
.dropdown-menu button:hover,.dropdown-menu button:focus-visible{background:var(--hover)}
.dropdown-menu button span{font-weight:400}
#export-options{right:0;top:calc(100% + 8px)}
#export-options::before{content:"";position:absolute;top:-8px;left:0;right:0;height:8px}
#canvas-add-menu{position:fixed;z-index:40}
#node-image-menu{position:fixed;z-index:40}
.node-header .node-image-actions{flex:none;min-height:28px;height:28px;margin-left:auto;padding:3px 8px;border-color:var(--border);color:var(--muted);font-size:12px;font-weight:400}
.zoom-sensitivity-range{display:flex;justify-content:space-between;margin-top:4px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* 回收站复用模块画布。 */
#recycle-empty{position:absolute;top:45%;left:0;right:0;margin:0;color:var(--muted);text-align:center;pointer-events:none}
.node-recycled .ref-label{max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 完整页面查看与标记。 */
#viewer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--soft)}
#viewer[hidden]{display:none}
.viewer-toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);align-items:center;flex-shrink:0;gap:8px;height:52px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.viewer-toolbar>button{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.viewer-toolbar #viewer-image-trigger{justify-self:end;border-color:var(--border);font-size:13px}
.viewer-toolbar strong{justify-self:center;width:100%;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:center;white-space:nowrap;font-size:14px;font-weight:600}
#page-viewport{position:relative;flex:1;overflow:auto;padding:24px 24px 80px}
#page-stage{position:relative;margin:0 auto;background:var(--surface);outline:1px solid var(--line);transform-origin:0 0}
#page-stage img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#page-stage.mobile-page{outline:none;border:0}
#page-stage .note-preview{height:100%;overflow:auto}
#page-stage .note-preview img{pointer-events:auto}
#page-stage.note-stage{overflow:hidden}
#page-stage.note-stage .note-preview{position:absolute;left:0;top:0;height:auto;max-height:none;overflow:visible;transform-origin:0 0}
.hotspot{position:absolute;min-height:0;cursor:pointer;background:transparent;border:0;border-radius:0;padding:0}
.hotspot:hover,.hotspot:focus-visible{background:var(--selected);background-color:#00B8310D;outline:2px solid var(--green);outline-offset:0}
.pin{position:absolute;z-index:4;display:block;width:24px;height:24px;min-height:0;padding:0;border:1px solid white;border-radius:50%;background:#2F85F9;color:white;text-align:center;transform:translate(-50%,-150%);font-size:12px;line-height:22px;box-shadow:0 0 8px rgba(0,0,0,.14)}
.pin:hover{background:#2F85F9;color:white}
.pin.selected{background:var(--green);outline:3px solid var(--selected)}
.pin::after{content:"";position:absolute;left:50%;bottom:-12px;width:1px;height:12px;background:#2F85F9;pointer-events:none}
.pin.below{transform:translate(-50%,50%)}
.pin.below::after{bottom:auto;top:-12px}
.pin.selected::after{background:var(--green)}
.capture{position:absolute;inset:0;z-index:6;cursor:crosshair}
.rubber{position:absolute;border:2px solid var(--green);background:var(--selected);opacity:.6;pointer-events:none}
.annotation{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.annotation.selected{background:var(--selected)}
.annotation .number{padding:2px 8px;border-radius:var(--radius);background:var(--selected);color:var(--green);font-size:12px}
.annotation-editor{position:fixed;z-index:45;display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);box-shadow:var(--floating-shadow)}
.annotation-editor textarea{display:block;width:100%;min-width:0;min-height:80px;max-height:220px;margin:0;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-size:13px;line-height:1.5;resize:vertical}
.annotation-editor textarea::placeholder{color:var(--subtle)}
.annotation-editor textarea:focus{border-color:var(--green);outline:2px solid var(--selected)}
.annotation-editor footer{display:flex;align-items:center;gap:8px;width:100%;margin:0}
.annotation-editor footer .tool-icon{color:var(--danger)}
.annotation-editor footer button{height:32px;min-height:32px;padding:6px 12px;border-radius:var(--radius);font-size:13px}
.annotation-editor footer .tool-icon{width:32px;padding:6px}
.annotation-editor-cancel{border:1px solid var(--border);color:var(--ink)}
.annotation-editor-save{background:var(--green);color:white;font-weight:400}
.annotation-editor-save:hover{background:var(--green-hover)}
.annotation-editor-save:active{background:var(--green-press)}
.annotation-editor-cancel:hover,.annotation-editor footer .tool-icon:hover{background:var(--hover)}
.annotation-editor>button{align-self:flex-end;border:1px solid var(--border)}
.annotation-editor .markdown{min-width:0;max-height:220px;overflow:auto;font-size:13px}
.annotation-editor .markdown p:first-child{margin-top:0}
.page-point-explanations{margin-top:24px;border-top:1px solid var(--line)}
#inspector .point-summary{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 0;border-bottom:1px solid var(--line)}
.point-summary-main{display:flex;align-items:flex-start;justify-content:flex-start;flex:1;gap:8px;min-width:0;padding:4px;white-space:normal;text-align:left}
.point-summary>.tool-icon{margin-top:0}
.point-summary.selected{background:var(--selected)}
.point-summary .number{flex:none;min-width:24px;padding:2px 6px;border-radius:var(--radius);background:var(--selected);color:var(--green);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.point-summary .markdown{flex:1;min-width:0;font-size:13px}
.point-summary .markdown p:first-child{margin-top:0}
.point-summary .markdown p:last-child{margin-bottom:0}

/* 系统反馈与只读分享。 */
#message{position:absolute;z-index:20;bottom:72px;left:16px;right:16px;max-width:640px;padding:12px 48px 12px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--floating-shadow)}
#message button{color:var(--blue)}
#message .message-close{position:absolute;top:8px;right:8px;width:28px;height:28px;min-height:28px;padding:0;color:var(--muted);font-size:20px;line-height:1}
.control-tooltip{position:fixed;z-index:100;max-width:280px;padding:6px 8px;border-radius:var(--radius);background:#303640;color:white;box-shadow:0 0 8px rgba(0,0,0,.14);font-size:12px;line-height:1.5;pointer-events:none;overflow-wrap:anywhere}
dialog{width:440px;padding:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);box-shadow:var(--floating-shadow)}
dialog::backdrop{background:#14141455}
dialog h2{margin:0 0 20px;font-size:14px;font-weight:600}
#image-replace-description{margin:0;overflow-wrap:anywhere}
dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
#branch-options button{display:block;width:100%;margin:8px 0;border:1px solid var(--border);text-align:left;white-space:normal}
.readonly #edit-tools,.readonly #export-menu,.readonly .editor-only{display:none!important}
@media(max-width:1050px){
  .layout{--sidebar-width:200px;--inspector-width:264px}
  .toolbar{gap:8px;padding:0 12px}
  .toolbar #project-title{font-size:14px}
  .toolbar #module-title{display:none}
}
@media(max-width:720px){
  .layout{--sidebar-width:168px;grid-template-columns:var(--sidebar-width) minmax(0,1fr)}
  #inspector{position:absolute;z-index:12;right:0;top:var(--toolbar-height);bottom:0;display:block;width:264px}
  .toolbar{overflow-x:auto}
  .zoom-tools{left:12px;bottom:12px;gap:0;max-width:calc(100% - 24px)}
  .zoom-tools>button,.zoom-tools .tool-icon,.zoom-settings>summary{width:28px;min-width:28px}
  #zoom-label{width:68px;min-width:68px}
}
@media(prefers-reduced-motion:reduce){button,.node-port{transition:none}}

/* 体验模式沿用相同页面，只保留流程切换和重新开始。 */
#experience-tools{display:flex;align-items:center;gap:8px}#experience-tools[hidden]{display:none}
#experience-flow{min-width:120px;max-width:240px}
#page-stage>.page-frame{pointer-events:auto}
.experience .layout{grid-template-columns:minmax(0,1fr)}
.experience #workspace{grid-column:1}
.experience #sidebar,.experience #inspector,.experience .panel-toggle,.experience #edit-tools,.experience #export-menu,.experience .zoom-tools,.experience .viewer-toolbar,.experience #module-title{display:none!important}
.experience #page-viewport{padding:20px;min-height:0}
.experience #project-title{max-width:40%}
.experience .hotspot:hover{background:transparent;outline:none}

/* 两种视图的切换始终可见。 */
#view-switch{display:flex;flex:none;gap:2px;padding:2px;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft)}
#view-switch button{min-height:28px;padding:3px 12px;color:var(--muted)}
#view-switch button[aria-pressed="true"]{background:var(--surface);color:var(--selected-ink);box-shadow:0 1px 3px #14141414}
#view-switch button:disabled{color:var(--disabled)}
#experience-tools{display:flex;align-items:center;gap:8px}
#experience-flow{width:auto;min-width:120px;max-width:240px;margin:0}

		return (region == null) ? {x: b.x, y: b.y, x2: x2, y2: y2} :
			{x: Math.min(region.x, b.x), y: Math.min(region.y, b.y),
			x2: Math.max(region.x2, x2), y2: Math.max(region.y2, y2)};
	};

	/**
	 * The given region grown by margin on all sides, or null if the grown
	 * region contains the given extent of all obstacles (no region needed).
	 */
	AvoidRouting.growRegion = function(region, margin, extent)
	{
		if (region == null || extent == null)
		{
			return null;
		}

		region = {x: region.x - margin, y: region.y - margin,
			x2: region.x2 + margin, y2: region.y2 + margin};

		return (region.x <= extent.x && region.y <= extent.y &&
			region.x2 >= extent.x2 && region.y2 >= extent.y2) ? null : region;
	};

	/**
	 * The obstacles ({x, y, w, h}) that intersect the given region.
	 */
	AvoidRouting.obstaclesIn = function(obstacles, region)
	{
		var result = [];

		for (var i = 0; i < obstacles.length; i++)
		{
			var v = obstacles[i];

			if (v != null && v.x <= region.x2 && v.x + v.w >= region.x &&
				v.y <= region.y2 && v.y + v.h >= region.y)
			{
				result.push(v);
			}
		}

		return result;
	};

	/**
	 * True if all points of the given routes keep the given clearance from the
	 * border of the region, ie. the routes keep the clearance from all
	 * obstacles outside of the region.
	 */
	AvoidRouting.routesInside = function(routes, region, clearance)
	{
		for (var i = 0; i < routes.length; i++)
		{
			for (var k = 0; k < routes[i].length; k++)
			{
				var p = routes[i][k];

				if (p.x < region.x + clearance || p.x > region.x2 - clearance ||
					p.y < region.y + clearance || p.y > region.y2 - clearance)
				{
					return false;
				}
			}
		}

		return true;
	};

	/**
	 * Compute obstacle-avoiding orthogonal routes for a set of edges.
	 *
	 * @param {object} Avoid - the libavoid instance (AvoidLib.getInstance()).
	 * @param {Array<{id:string,x:number,y:number,w:number,h:number,frame?}>} vertices
	 *        Obstacles, in ABSOLUTE coordinates: the UNROTATED bounds, with
	 *        the shape's transform as frame (shapeFrame of its style) — the
	 *        obstacle is then its rotated box and its ends' constraints and
	 *        snap points, given in the shape's own frame, are mapped to where
	 *        it draws them (toWorldFrame). Shapes enclosing a terminal of a
	 *        routed edge are dropped (filterEnclosing).
	 * @param {Array<{id,source,target,sourcePoint?,targetPoint?,
	 *        sourceConstraint?,targetConstraint?,
	 *        sourcePoints?,targetPoints?,sourceSides?,targetSides?,
	 *        sourceJetty?,targetJetty?}>} edges
	 *        Edges referencing vertex ids. An end may instead be a DANGLING free
	 *        point — sourcePoint/targetPoint {x,y} in absolute coords, used when
	 *        that terminal has no vertex (an unconnected endpoint): it routes to
	 *        a plain Point ConnEnd (no shape, no direction), matching the
	 *        drag-preview, and takes no constraint/pin/mask/jetty. An edge is
	 *        skipped when an end is neither a vertex nor a free point, and
	 *        when it is a SELF-LOOP (source === target) — loops keep the
	 *        caller's own loop styling and waypoints.
	 *        *Constraint = {x,y,dir} (constraintForPoint): a
	 *        fixed connection point routed via a directed ShapeConnectionPin;
	 *        absent => the endpoint floats at the shape centre. *Points = an
	 *        array of {x,y,dir} candidate anchors (draw.io's snapToPoint —
	 *        the shape's declared connection points): non-exclusive directed
	 *        pins at each candidate under one pin class, libavoid picks the
	 *        anchor that routes best; beaten by a *Constraint on the same end
	 *        (an explicit anchor wins) and beats a *Sides mask (the renderer's
	 *        snapToPoint branch runs before mask enforcement). *Sides = an
	 *        array of allowed attach sides ('N'/'S'/'E'/'W', the legacy
	 *        mxGraph portConstraint masks): non-exclusive pins spread along
	 *        the allowed sides under one pin class, libavoid picks side and
	 *        position. *Jetty = the minimum length of the first/last
	 *        segment in px (draw.io's jettySize), enforced for ends with a
	 *        *Constraint by a routing checkpoint at the stub tip — requested
	 *        lazily, only for edges whose natural route falls short of the
	 *        minimum; snapped and masked ends behave like floating ones here
	 *        (their first bend naturally sits ~shapeBufferDistance out).
	 *        Ends with the same candidate pins on one shape share them.
	 * @param {{shapeBufferDistance?:number,idealNudgingDistance?:number}} [opts]
	 *        Defaults: 16 / 14. A connector libavoid finds no route for is
	 *        retried alone at half the buffer, down to 2px.
	 * @returns {Object<string, Array<{x:number,y:number}>>} edge id -> interior
	 *        bend points (ABSOLUTE, collinear-filtered). The first/last route
	 *        points (endpoints) are dropped — a floating endpoint connects at
	 *        the shape side midpoint, which is where a floating
	 *        orthogonalEdgeStyle endpoint lands anyway. An edge with a
	 *        straight (bend-free) route maps to []; an edge libavoid found no
	 *        route for even on retry has NO entry, like a skipped one.
	 */
	AvoidRouting.computeRoutes = function(Avoid, vertices, edges, opts)
	{
		var out = Object.create(null);

		if (Avoid == null || vertices == null || edges == null)
		{
			return out;
		}

		var buffer = (opts && opts.shapeBufferDistance != null) ? opts.shapeBufferDistance : 16;
		var nudge = (opts && opts.idealNudgingDistance != null) ? opts.idealNudgingDistance : 14;

		// Rotated, turned and flipped shapes: route around the box they are
		// drawn in, from the connection points where they are drawn.
		var world = AvoidRouting.toWorldFrame(vertices, edges);
		vertices = world.vertices;
		edges = world.edges;

		// Containers the terminals live in are not obstacles (also feeds the
		// jettyStub checks below, so stubs inside a container are preserved).
		vertices = AvoidRouting.filterEnclosing(vertices, edges);

		function collinear(a, b, c)
		{
			// Zero cross product (1px tolerance) => b lies on segment a..c (redundant).
			return Math.abs((b.x - a.x) * (c.y - a.y) - (c.x - a.x) * (b.y - a.y)) < 1;
		}

		// A connector's display route as plain {x, y} points, freeing exactly
		// what the binding hands over: displayRoute() and PolyLine.at() are
		// UNOWNED references in draw.io's own binding (drawio-libavoid: the
		// editor, the mcp app server) — deleting one destroys the route in
		// place — and a fresh OWNED copy per call in the upstream libavoid-js
		// build (the mcp tool server). Two calls alias one object only for
		// references (isAliasOf), probed once per call. A leaked copy is not
		// just memory: libavoid breaks ties between equal coordinates by
		// object address, so it moved the next solve's allocations and a
		// long-lived module routed identical input differently.
		var ownedRoutes = null;
		var ownedPoints = null;

		function owned(first, second)
		{
			if (first.isAliasOf(second))
			{
				return false;
			}

			second.delete();

			return true;
		}

		function readRoute(conn)
		{
			var route = conn.displayRoute();
			var n = route.size();
			var pts = [];

			if (ownedRoutes == null)
			{
				ownedRoutes = owned(route, conn.displayRoute());
			}

			for (var k = 0; k < n; k++)
			{
				var p = route.at(k);

				if (ownedPoints == null)
				{
					ownedPoints = owned(p, route.at(k));
				}

				pts.push({x: p.x, y: p.y});

				if (ownedPoints)
				{
					p.delete();
				}
			}

			if (ownedRoutes)
			{
				route.delete();
			}

			return pts;
		}

		// Proportional pins on bounds b as absolute {x, y} (null stays null).
		function absolutePins(b, pins)
		{
			if (pins == null)
			{
				return null;
			}

			var abs = [];

			for (var k = 0; k < pins.length; k++)
			{
				abs.push({x: b.x + pins[k].x * b.w, y: b.y + pins[k].y * b.h});
			}

			return abs;
		}

		// Endpoint anchor: the free point for a dangling end, else the fixed
		// connection point, else the shape centre — the point the ConnEnd routes
		// from.
		function anchor(b, constraint, freePoint)
		{
			if (b == null)
			{
				return freePoint;
			}

			return (constraint != null) ?
				{x: b.x + constraint.x * b.w, y: b.y + constraint.y * b.h} :
				{x: b.x + b.w / 2, y: b.y + b.h / 2};
		}

		// One libavoid solve of batch at the given clearance around the given
		// obstacles. Returns {routes, points, failed}: the routed edges' bends
		// by edge id, every route's points (endpoints included) and the edges
		// libavoid found NO route for (isFallbackRoute), in batch order.
		function solveWith(batch, clearance, obstacles)
		{
			var router = new Avoid.Router(Avoid.RouterFlag.OrthogonalRouting.value);

			try { router.setRoutingParameter(Avoid.RoutingParameter.shapeBufferDistance, clearance); } catch (e) {}
			try { router.setRoutingParameter(Avoid.RoutingParameter.idealNudgingDistance, nudge); } catch (e) {}

			var bounds = Object.create(null);
			var shapeRefs = Object.create(null);
			var pinClasses = Object.create(null);
			var pinClass = 0;
			var i;

			for (i = 0; i < obstacles.length; i++)
			{
				var v = obstacles[i];

				if (v == null || v.id == null || !(v.w > 0) || !(v.h > 0))
				{
					continue;
				}

				bounds[v.id] = v;
				// Point/Rectangle are embind value wrappers that COPY into the
				// ShapeRef and are NOT freed by router.delete(); free the temporaries.
				var rp1 = new Avoid.Point(v.x, v.y);
				var rp2 = new Avoid.Point(v.x + v.w, v.y + v.h);
				var rect = new Avoid.Rectangle(rp1, rp2);
				shapeRefs[v.id] = new Avoid.ShapeRef(router, rect);
				rect.delete();
				rp1.delete();
				rp2.delete();
			}

			// ONE pin class per distinct candidate set on a shape, with
			// non-exclusive pins, shared by every end that attaches there.
			// Two pins at the SAME point in different classes break libavoid's
			// orthogonal visibility sweep, which assumes no two breakpoints
			// coincide (an assert in orthogonal.cpp, compiled out in release
			// builds): the connector registered second got no route at all —
			// every fan-out/fan-in on one fixed connection point, snap-point
			// set or side mask. The key is order-free; the pins are registered
			// in the first end's order.
			function pinClassFor(vid, pins)
			{
				var parts = [];

				for (var k = 0; k < pins.length; k++)
				{
					parts.push(pins[k].x + ',' + pins[k].y + ',' + pins[k].dir);
				}

				var key = vid + '\n' + parts.sort().join(' ');

				if (pinClasses[key] == null)
				{
					pinClasses[key] = ++pinClass;

					for (k = 0; k < pins.length; k++)
					{
						// Registers itself with the ShapeRef (freed with the
						// router); the wrapper is only kept to make it shareable.
						var pin = new Avoid.ShapeConnectionPin(shapeRefs[vid], pinClass,
							pins[k].x, pins[k].y, true, 0, pins[k].dir);
						pin.setExclusive(false);
					}
				}

				return pinClasses[key];
			}

			// An endpoint is FLOATING (ConnEnd at the shape centre) unless it
			// has candidate pins (endPins): a fixed connection point — a
			// directed pin makes the route leave/enter the anchor
			// perpendicular to the shape edge instead of cutting through it —
			// a snap-point set (draw.io's snapToPoint: the shape's declared
			// connection points) or a side MASK (the legacy mxGraph
			// portConstraint vocabulary). A set's pins share one class, so
			// libavoid picks the anchor (side and position) that routes best;
			// ends sharing a class share its pins and nudging separates their
			// corridors, like the render-time router spreading floating
			// attaches.
			function makeEnd(vid, b, pins, freePoint)
			{
				// Dangling end: no vertex bounds, just a free point (the edge's
				// unconnected endpoint). Route to a plain Point ConnEnd — no shape,
				// no direction — exactly as the warm-session drag preview does, so a
				// committed edge with an unconnected end matches its live preview.
				if (b == null)
				{
					var dp = new Avoid.Point(freePoint.x, freePoint.y);
					var dce = new Avoid.ConnEnd(dp);
					dp.delete();
					return dce;
				}

				if (pins != null && shapeRefs[vid] != null)
				{
					return new Avoid.ConnEnd(shapeRefs[vid], pinClassFor(vid, pins));
				}

				// Free the temporary centre Point (copied into the ConnEnd); the
				// ConnEnd itself is freed by the ConnRef caller below.
				var cp = new Avoid.Point(b.x + b.w / 2, b.y + b.h / 2);
				var ce = new Avoid.ConnEnd(cp);
				cp.delete();

				return ce;
			}

			// Wrap a stub tip as a routing checkpoint. Checkpoint copies the Point
			// and the vector copies the Checkpoint — free both embind wrappers.
			function addCheckpoint(vec, p)
			{
				if (p != null)
				{
					var pt = new Avoid.Point(p.x, p.y);
					var cp = new Avoid.Checkpoint(pt);
					vec.push_back(cp);
					cp.delete();
					pt.delete();
				}
			}

			var conns = [];

			for (i = 0; i < batch.length; i++)
			{
				var e = batch[i];

				if (e == null)
				{
					continue;
				}

				var sb = bounds[e.source];
				var tb = bounds[e.target];

				// An end is either a known vertex (sb/tb) or a dangling free point
				// (e.sourcePoint / e.targetPoint, absolute coords) for an unconnected
				// endpoint. Skip only when an end is neither.
				if ((sb == null && e.sourcePoint == null) ||
					(tb == null && e.targetPoint == null))
				{
					continue;
				}

				// Self-loops are out of scope: obstacle avoidance between identical
				// endpoints is meaningless and the orthogonal router degenerates to
				// a buffer-sized hook beside the shape. Skipping leaves the caller's
				// loop styling and waypoints untouched (an edge with no route entry
				// is never written), e.g. draw.io's inner-loop-waypoint self-loops.
				if (e.source != null && e.source === e.target)
				{
					continue;
				}

				var sPins = (sb != null) ? AvoidRouting.endPins(sb,
					e.sourceConstraint, e.sourceSides, e.sourcePoints) : null;
				var tPins = (tb != null) ? AvoidRouting.endPins(tb,
					e.targetConstraint, e.targetSides, e.targetPoints) : null;

				// ConnRef copies the ConnEnds, so free them after construction
				// (they are not owned by the router).
				var se = makeEnd(e.source, sb, sPins, e.sourcePoint);
				var de = makeEnd(e.target, tb, tPins, e.targetPoint);
				var conn = new Avoid.ConnRef(router, se, de);
				se.delete();
				de.delete();

				// Jetty stubs: force the route through a checkpoint jetty px
				// outward of each constrained anchor, so the first/last segment is
				// at least that long. Capped per end to the clearance the terminal
				// pair's gap allows along the stub's axis (cappedJetty). Skipped
				// for ends where there is nothing to enforce (jettyStub), and for
				// the whole edge when the anchors are closer than the summed
				// stubs — the same too-short guard as mxEdgeStyle.OrthConnector —
				// so a short edge isn't forced to double back through its
				// checkpoints. The stubs are computed here but requested LAZILY
				// after the first solve (see below).
				var sourceJetty = AvoidRouting.cappedJetty(e.sourceJetty, e.sourceConstraint, sb, tb);
				var targetJetty = AvoidRouting.cappedJetty(e.targetJetty, e.targetConstraint, tb, sb);
				var sa = anchor(sb, e.sourceConstraint, e.sourcePoint);
				var ta = anchor(tb, e.targetConstraint, e.targetPoint);

				// A pinned anchor buried inside ANOTHER obstacle (a shape dragged
				// over the terminal) puts the whole route into libavoid's escape /
				// degenerate mode: checkpoints on such a route are unreachable and
				// libavoid warns ("skipping checkpoint") for EVERY end — including
				// tips in perfectly clear space — before discarding them. Skip BOTH
				// stubs for the edge instead (verified against the WASM: same
				// route, no console noise).
				var buried = (e.sourceConstraint != null &&
						AvoidRouting.insideAny(sa.x, sa.y, vertices)) ||
					(e.targetConstraint != null &&
						AvoidRouting.insideAny(ta.x, ta.y, vertices));

				var scp = buried ? null :
					AvoidRouting.jettyStub(e.sourceConstraint, sourceJetty, sb, vertices, clearance);
				var tcp = buried ? null :
					AvoidRouting.jettyStub(e.targetConstraint, targetJetty, tb, vertices, clearance);

				if (scp != null || tcp != null)
				{
					var dx = ta.x - sa.x;
					var dy = ta.y - sa.y;
					var total = ((scp != null) ? sourceJetty : 0) +
						((tcp != null) ? targetJetty : 0);

					if (dx * dx + dy * dy < total * total)
					{
						scp = null;
						tcp = null;
					}
				}

				conns.push({edge: e, conn: conn, scp: scp, tcp: tcp,
					sourceJetty: sourceJetty, targetJetty: targetJetty,
					sourcePins: absolutePins(sb, sPins),
					targetPins: absolutePins(tb, tPins),
					sourceEnd: [e.source, sb, sPins, e.sourcePoint]});
			}

			var result = {routes: Object.create(null), points: [], failed: []};

			if (conns.length === 0)
			{
				router.delete();
				return result;
			}

			router.processTransaction();

			// LAZY jetty enforcement: the first solve runs WITHOUT the stub
			// checkpoints; they are requested only for edges whose natural route
			// violates a jetty minimum, and the transaction re-processed once. A
			// checkpoint is a hard point the route must touch: when libavoid
			// TURNS at one instead of crossing it mid-segment, the adjacent bend
			// is pinned at the stub tip and nudging cannot center the segment in
			// its channel — lopsided lead-outs (e.g. 30/10 on one edge next to a
			// centered 20/20 twin) on routes that met the minimum for free.
			// Enforcing lazily keeps the nudged, evenly distributed route
			// wherever it already satisfies the jetty, and falls back to the
			// checkpointed solve only where it does not. A connector without a
			// route gets no checkpoints: they cannot give it one, only
			// "skipping checkpoint" warnings.
			var dirty = false;

			for (i = 0; i < conns.length; i++)
			{
				var c = conns[i];

				if (c.scp == null && c.tcp == null)
				{
					continue;
				}

				// 0.5px tolerance: sub-pixel misses vanish in the output rounding
				// and do not warrant pinning the route to the checkpoints.
				var r0 = readRoute(c.conn);

				if (!AvoidRouting.isFallbackRoute(r0, c.sourcePins, c.targetPins) &&
					((c.scp != null && AvoidRouting.endSegment(r0, true) < c.sourceJetty - 0.5) ||
					(c.tcp != null && AvoidRouting.endSegment(r0, false) < c.targetJetty - 0.5)))
				{
					// In route order (source first); setRoutingCheckpoints copies
					// the vector, so free the wrapper.
					var cps = new Avoid.CheckpointVector();
					addCheckpoint(cps, c.scp);
					addCheckpoint(cps, c.tcp);
					c.conn.setRoutingCheckpoints(cps);
					cps.delete();

					// Queues the reroute: see the setRoutingCheckpoints gotcha
					// in the header
					var se2 = makeEnd.apply(null, c.sourceEnd);
					c.conn.setSourceEndpoint(se2);
					se2.delete();
					dirty = true;
				}
			}

			if (dirty)
			{
				router.processTransaction();
			}

			for (i = 0; i < conns.length; i++)
			{
				var pts = readRoute(conns[i].conn);

				if (AvoidRouting.isFallbackRoute(pts, conns[i].sourcePins, conns[i].targetPins))
				{
					result.failed.push(conns[i].edge);
					continue;
				}

				var wps = [];

				for (var k = 1; k < pts.length - 1; k++)
				{
					if (collinear(pts[k - 1], pts[k], pts[k + 1]))
					{
						continue;
					}

					wps.push({x: Math.round(pts[k].x), y: Math.round(pts[k].y)});
				}

				result.routes[conns[i].edge.id] = wps;
				result.points.push(pts);
			}

			router.delete();
			return result;
		}

		// Terminal bounds by id for the regions, matching the bounds that
		// solveWith registers, and the extent of all obstacles
		var terminals = Object.create(null);
		var extent = null;

		for (var i = 0; i < vertices.length; i++)
		{
			var v = vertices[i];

			if (v != null)
			{
				extent = AvoidRouting.addToRegion(extent, v);

				if (v.id != null && v.w > 0 && v.h > 0)
				{
					terminals[v.id] = v;
				}
			}
		}

		// One solve of batch at the given clearance. Writes the routed edges
		// into out; returns the edges libavoid found NO route for, in batch
		// order, for the retry below. The obstacles are limited to a region
		// around the batch's ends: the cost of a solve grows with the number
		// of obstacles (~400ms for one edge among 2600 shapes), not with the
		// distance the routes cover. A route that keeps the clearance from
		// the region's border is also valid with all obstacles and, as fewer
		// obstacles never make the best route worse, also a best route with
		// all obstacles. Routes closer to the border are solved again in a
		// larger region. A connector without a route in the region has none
		// with all obstacles either, as more obstacles never open up a route.
		function solve(batch, clearance)
		{
			var margin = AvoidRouting.regionMargin;
			var region = null;

			for (var i = 0; i < batch.length; i++)
			{
				var e = batch[i];

				if (e != null)
				{
					var sb = (e.source != null) ? terminals[e.source] : null;
					var tb = (e.target != null) ? terminals[e.target] : null;
					region = AvoidRouting.addToRegion(region, (sb != null) ? sb : e.sourcePoint);
					region = AvoidRouting.addToRegion(region, (tb != null) ? tb : e.targetPoint);
				}
			}

			region = AvoidRouting.growRegion(region, margin, extent);

			while (true)
			{
				var result = solveWith(batch, clearance, (region != null) ?
					AvoidRouting.obstaclesIn(vertices, region) : vertices);

				if (region == null || AvoidRouting.routesInside(
					result.points, region, clearance))
				{
					for (var id in result.routes)
					{
						out[id] = result.routes[id];
					}

					return result.failed;
				}

				for (i = 0; i < result.points.length; i++)
				{
					for (var k = 0; k < result.points[i].length; k++)
					{
						region = AvoidRouting.addToRegion(region, result.points[i][k]);
					}
				}

				margin *= 2;
				region = AvoidRouting.growRegion(region, margin, extent);
			}
		}

		// A connector libavoid found NO route for is retried on its own with
		// the clearance halved, down to 2px: typically a pinned end faces a
		// gap narrower than twice the buffer (a label or marker placed a few
		// px from the shape), which the buffered obstacles close. Only the
		// failed connectors are re-solved — the others keep the configured
		// clearance — so a retried route is not nudged against the rest,
		// like the editor's per-buffer buckets. Whatever still fails has no
		// entry: callers leave such an edge as authored instead of writing
		// the fallback's straight line over its waypoints.
		var failed = solve(edges, buffer);

		for (var retry = Math.floor(buffer / 2); failed.length > 0 && retry >= 2;
			retry = Math.floor(retry / 2))
		{
			failed = solve(failed, retry);
		}

// 只计算路径。页面、控件绑定、手动折线和批注均不写回。
export const canvasCardSize={width:400,height:290,header:40};
export const mobileCardSize={width:240,height:560,header:40};
export function nodeCardType(n){return n.canvasType==='pc'||n.canvasType==='mobile'?n.canvasType:n.kind==='html'&&(n.render?.template?.startsWith('mobile')||n.width<=480&&n.height>n.width)?'mobile':'pc';}
export const nodeCardSize=n=>nodeCardType(n)==='mobile'?mobileCardSize:canvasCardSize;

const routingSessions=new Map();
const routingVectors={top:[0,-1],right:[1,0],bottom:[0,1],left:[-1,0]};
const routingDirs={top:1,bottom:2,left:4,right:8};
const routingHits=(a,b,r)=>a[0]===b[0]?a[0]>r.x&&a[0]<r.x+r.w&&Math.max(a[1],b[1])>r.y&&Math.min(a[1],b[1])<r.y+r.h:a[1]>r.y&&a[1]<r.y+r.h&&Math.max(a[0],b[0])>r.x&&Math.min(a[0],b[0])<r.x+r.w;
const routingManual=line=>Array.isArray(line.edge.waypoints);

function routingResult(points,engine){
  const out=[];
  for(const point of points){
    const p=[...point],previous=out.at(-1);
    if(previous){for(let axis=0;axis<2;axis++)if(Math.abs(p[axis]-previous[axis])<1e-6)p[axis]=previous[axis];if(p[0]===previous[0]&&p[1]===previous[1])continue;}
    out.push(p);
    while(out.length>2){const [a,b,c]=out.slice(-3);if((a[0]===b[0]&&b[0]===c[0]||a[1]===b[1]&&b[1]===c[1])&&(b[0]-a[0])*(c[0]-b[0])+(b[1]-a[1])*(c[1]-b[1])>=0)out.splice(-2,1);else break;}
  }
  let segment=out.slice(0,2),longest=0;
  for(let i=1;i<out.length;i++){const a=out[i-1],b=out[i],length=Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);if(length>longest){longest=length;segment=[a,b];}}
  return {points:out,path:out.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '),label:[(segment[0][0]+segment[1][0])/2+8,(segment[0][1]+segment[1][1])/2-8],engine};
}

function routingConstraint(n,point,side){const clamp=v=>Math.max(0,Math.min(1,v)),size=nodeCardSize(n);return {x:clamp((point[0]-n.x)/size.width),y:clamp((point[1]-n.y)/size.height),dir:routingDirs[side]};}
function routingFree(point,side){const v=routingVectors[side];return {x:point[0]+v[0]*32,y:point[1]+v[1]*32};}

export function markdown(text, images={}) {

      result+=escapeHTML(s.slice(last,m.index));

      else if(m[3]!==undefined)result+=`<code>${escapeHTML(m[3])}</code>`;
      else result+=`<strong>${inline(m[4])}</strong>`;
      last=m.index+m[0].length;
    }
    return result+escapeHTML(s.slice(last));
  };
  for(let i=0;i<lines.length;i++) {
    const line=lines[i];
    if(/^\s*\|.*\|\s*$/.test(line)) {
      if(!table){out+='<table>';table=true;}
      if(/^\s*\|[\s:|\-]+\|\s*$/.test(line))continue;
      const header=/^\s*\|[\s:|\-]+\|\s*$/.test(lines[i+1]||'');
      out+='<tr>'+line.trim().slice(1,-1).split('|').map(c=>`<${header?'th':'td'}>${inline(c.trim())}</${header?'th':'td'}>`).join('')+'</tr>';continue;
    }
    if(table){out+='</table>';table=false;}
    if(/^\s*[-*]\s/.test(line)){if(!list){out+='<ul>';list=true;}out+=`<li>${inline(line.replace(/^\s*[-*]\s/,''))}</li>`;continue;}
    if(list){out+='</ul>';list=false;}
    out+=line?`<p>${inline(line)}</p>`:'<br>';

}
// 说明编辑区只序列化文字、基础格式与已上传图片，不保留外部粘贴的 HTML。

export function importManifest(manifest) {

  for(const r of manifest.requirements||[]) {
    model.modules.push({id:r.id,title:r.title,entry:`${r.id}:${(r.states.find(s=>s.initial)||r.states[0]).id}`});
    r.states.forEach((s,i)=>model.nodes.push({id:`${r.id}:${s.id}`,module:r.id,title:s.desc||s.id,kind:'html',path:s.html,width:1280,height:800,x:60,y:60+i*360,description:s.desc||''}));

// 页面在不具备同源权限的 iframe 中运行；这里只传递演示上下文和已声明的跳转。
export function cleanContext(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
  return Object.fromEntries(Object.entries(value).filter(([key, item]) =>
    /^[A-Za-z][\w-]*$/.test(key) && !['__proto__', 'constructor', 'prototype'].includes(key) &&
    (typeof item === 'string' || typeof item === 'boolean' || typeof item === 'number' && Number.isFinite(item))));
}

export function flowEntries(model) {
  if (model.flows?.length) return model.flows.filter(flow => model.nodes.some(node => node.id === flow.entry));
  return model.modules.map(module => ({
    id: module.id, title: module.title,
    entry: model.nodes.some(node => node.id === module.entry) ? module.entry : model.nodes.find(node => node.module === module.id && node.kind !== 'note' && node.overview !== false)?.id
  })).filter(flow => flow.entry);
}

export function thumbnailHTML(html) {

    .replace(/<meta\b[^>]*http-equiv\s*=\s*["']?(?:refresh|content-security-policy)\b[^>]*>/gi, '').replace(/<base\b[^>]*>/gi, '')

// 此函数会内嵌到原型页面，不引用模块内变量。
export function pageBridge(config) {
  let context = {...config.context};
  const send = (type, data = {}) => parent.postMessage({yuanxing: config.token, type, ...data}, '*');
  const query = selector => { try { return document.querySelector(selector); } catch { return null; } };
  const queryAll = selector => { try { return [...document.querySelectorAll(selector)]; } catch { return []; } };
  const valueOf = element => element.type === 'checkbox' ? element.checked : element.value;
  function collect() {
    for (const element of queryAll('[data-yx-bind]')) {
      if (element.type === 'radio' && !element.checked) continue;
      context[element.dataset.yxBind] = valueOf(element);
    }
    return context;
  }
  function paint() {
    for (const element of queryAll('[data-yx-text]')) element.textContent = String(context[element.dataset.yxText] ?? '');
    for (const element of queryAll('[data-yx-visible]')) element.hidden = String(context[element.dataset.yxVisible] ?? '') !== element.dataset.yxValue;
  }
  function measure() {
    const positions = {};

      const element = query(annotation.selector);

      const rect = element.getBoundingClientRect(), offset = annotation.offset || [.5, .5];
      if (rect.width && rect.height) positions[annotation.id] = [(rect.x + rect.width * offset[0]) / config.width, (rect.y + rect.height * offset[1]) / config.height];
    }

  }
  function sync() { collect(); paint(); send('context', {context}); measure(); }
  function localAction(element) {
    const action = element.dataset.yxAction, targets = queryAll(element.dataset.yxTarget || '');
    if (action === 'show' || action === 'hide' || action === 'toggle') {
      for (const target of targets) target.hidden = action === 'toggle' ? !target.hidden : action === 'hide';
    } else if (action === 'tab') {
      for (const target of queryAll(element.dataset.yxGroup || '[data-yx-panel]')) target.hidden = !targets.includes(target);
      for (const sibling of element.parentElement?.querySelectorAll('[data-yx-action="tab"]') || []) {
        sibling.classList.toggle('active', sibling === element);
        sibling.setAttribute('aria-selected', String(sibling === element));
      }
    } else if (action === 'set' && element.dataset.yxKey) {
      context[element.dataset.yxKey] = element.dataset.yxValue ?? '';
    }
    // 不重新读取旧表单值，以免覆盖 set 操作刚设置的上下文。
    paint(); send('context', {context}); measure();
  }

    const clicked = event.target.closest?.('button,a,input,[data-yx-action],[data-yx-id]') || event.target;
    if (clicked.disabled || clicked.getAttribute?.('aria-disabled') === 'true') return;
    collect();

    if (matches.length) {
      const form = clicked.closest?.('form');

    }
    const action = event.target.closest?.('[data-yx-action]');
    if (action) { event.preventDefault(); localAction(action); }

  }, true);
  document.addEventListener('submit', event => event.preventDefault());
  document.addEventListener('input', sync);
  document.addEventListener('change', sync);
  document.addEventListener('scroll', measure, true);
  for (const element of queryAll('[data-yx-bind]')) {
    const key = element.dataset.yxBind;
    if (!(key in context)) continue;
    if (element.type === 'checkbox') element.checked = !!context[key];
    else if (element.type === 'radio') element.checked = element.value === String(context[key]);
    else element.value = String(context[key]);
  }

  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(measure).observe(document.body);
  window.addEventListener('load', measure, {once: true});
}

export function prototypeDocument(html, config) {
  const data = JSON.stringify({...config, context: cleanContext(config.context)}).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  const policy = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">`;
  // CSP 必须早于输入内容；移除输入自己的 CSP、base 和页面自动跳转。
  html = html.replace(/<meta\b[^>]*http-equiv\s*=\s*["']?(?:refresh|content-security-policy)\b[^>]*>/gi, '').replace(/<base\b[^>]*>/gi, '');
  if (/<head\b[^>]*>/i.test(html)) html = html.replace(/<head\b[^>]*>/i, match => match + policy);
  else if (/<html\b[^>]*>/i.test(html)) html = html.replace(/<html\b[^>]*>/i, match => match + `<head>${policy}</head>`);
  else html = `<!doctype html><html><head>${policy}</head><body>${html}</body></html>`;
  const bridge = `<script>(${pageBridge.toString()})(${data});<\/script>`;
  return /<\/body\s*>/i.test(html) ? html.replace(/<\/body\s*>/i, bridge + '</body>') : html + bridge;
}

// 保留仍在画布上的节点 DOM；移动已有 iframe 会让浏览器重新加载原型。

  for(const [id,card] of existing)if(!wanted.has(id))card.remove();

export function searchCanvasPages(model,query){
  if(!query.trim())return [];
  const byId=new Map(model.nodes.map(n=>[n.id,n])),rank=new Map(model.modules.map((m,i)=>[m.id,i])),matches=new Map();
  for(const n of model.nodes){

    if(target&&target.overview!==false&&libraryIsPage(target)&&rank.has(target.module))matches.set(target.id,target);
  }
  return [...matches.values()].sort((a,b)=>rank.get(a.module)-rank.get(b.module)||libraryCompareNodes(a,b));

#sidebar .library-search{flex:1;min-width:0;min-height:28px;height:28px;margin:0;padding:4px 0;border:0;background:transparent;color:var(--ink);font-size:13px;line-height:20px;outline:none}
.library-sidebar-commands{display:flex;align-items:center;gap:8px;margin-top:12px}
#sidebar .library-sidebar-commands button{width:auto;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.library-module-heading{flex:1;padding:4px 8px;color:var(--muted);font-size:12px;font-weight:600}
.library-icon{display:inline-flex!important;align-items:center;justify-content:center;flex:none;width:28px!important;height:28px;min-height:28px;padding:4px!important;border:1px solid transparent;border-radius:var(--radius);color:var(--muted)}
.library-icon.danger{color:var(--danger)}
.library-module{margin:0 0 4px}
.library-module-row{display:flex;align-items:center;gap:4px;padding:0;border-top:2px solid transparent}
#sidebar .library-module-row .module{display:flex;align-items:center;justify-content:flex-start;flex:1;gap:8px;min-width:0;min-height:32px;width:auto;padding:5px 8px;font-size:13px;line-height:20px;font-weight:600;text-align:left}
.library-module-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.library-module-row .module>svg{flex:none;color:var(--subtle)}
.library-module-row .module.active>svg{color:var(--selected-ink)}
.library-module-handle{width:16px!important;padding:2px!important;cursor:grab;opacity:0}
.library-module-delete{opacity:0}
.library-module-row:hover .library-module-handle,.library-module-row:focus-within .library-module-handle,.library-module-row:hover .library-module-delete,.library-module-row:focus-within .library-module-delete{opacity:1}
.library-module-row.library-drop-before{border-top-color:var(--green)}
.library-sidebar-page{display:flex;align-items:center;min-width:0;margin-left:20px;padding-left:12px;border-left:1px solid var(--line)}
#sidebar .library-sidebar-page .state{flex:1;min-width:0;min-height:32px;width:auto;padding:5px 8px;font-size:13px;line-height:20px;text-align:left;overflow-wrap:anywhere}
.library-end-drop{display:none;margin-top:12px;padding:8px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);text-align:center;font-size:12px}
.library-dragging .library-end-drop{display:block}
.library-page{display:flex;align-items:center;margin-bottom:4px;border-radius:var(--radius)}
#sidebar .library-page-main{display:block;flex:1;min-width:0;width:100%;padding:8px;text-align:left;white-space:normal}
.library-page-title{display:block;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:20px;white-space:normal}
.library-page-meta{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:18px}
.library-page.active{background:var(--selected)}
.library-page.active .library-page-title{color:var(--selected-ink)}
.library-empty{margin:0;padding:24px 8px;color:var(--muted);text-align:center;font-size:12px}
#sidebar{display:flex;flex-direction:column;overflow:hidden}
#sidebar .library-sidebar-tools{flex:none}
.library-modules,.library-sidebar-results{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.library-sidebar-results:empty{display:none}
.library-sidebar-footer{flex:none;margin:12px -12px -16px;padding:8px 12px 12px;border-top:1px solid var(--line);background:var(--surface)}
#sidebar .library-recycle{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;color:var(--muted)}
#sidebar .library-recycle.active{background:var(--selected);color:var(--selected-ink)}

document.addEventListener('keydown',event=>{if(experience&&event.key==='Escape'&&!$('#branch-dialog').open){event.preventDefault();exitExperience();return;}if(event.defaultPrevented||$('#image-replace-dialog').open)return;if(event.key==='Escape'){closeAnnotationEditor();closeMenus();cancelConnection?.();mode=null;linkCaptureTarget=null;renderOverlays();}if(event.target.closest('input,textarea,select,[contenteditable]'))return;
  if(event.code==='Space'&&!current&&!event.target.closest('button,summary')){event.preventDefault();spacePressed=true;return;}
  if(event.key==='Escape'&&!current){activeCanvasGesture?.();selectNodes([]);return;}
  if(!readonly&&!current&&(event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='a'){event.preventDefault();selectNodes(activeCanvasNodes().filter(n=>!linesHidden||!isBranch(n)).map(n=>n.id));return;}
  if(!readonly&&!current&&(event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='d'){event.preventDefault();duplicateSelection();return;}
  if(!readonly&&!current&&selectedNodeIds().length&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();const amount=event.shiftKey?10:1,delta={ArrowLeft:[-amount,0],ArrowRight:[amount,0],ArrowUp:[0,-amount],ArrowDown:[0,amount]}[event.key];edit(m=>{if(recycleOpen)moveRecycleNodes(m,activeCanvasNodes().filter(n=>selectedNodeIds().includes(n.id)).map(n=>({id:n.id,x:n.x+delta[0],y:n.y+delta[1]})));else nudgeCanvasNodes(m,moduleId,selectedNodeIds(),...delta);},true,`nudge:${activeCameraKey()}:${selectedNodeIds().join(',')}`);return;}
  if(!current&&event.key.toLowerCase()==='f'&&!event.ctrlKey&&!event.metaKey&&!event.altKey){event.preventDefault();if(selectedNodeIds().length)fitSelection();else fit();return;}
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!panels.sidebar)togglePanel('sidebar');library.focusSearch();return;}
  if(!readonly&&!current&&selectedNodeIds().length&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&['Delete','Backspace'].includes(event.key)){event.preventDefault();deleteSelectedNodes();return;}
  if((event.ctrlKey||event.metaKey)&&!event.shiftKey&&event.key.toLowerCase()==='z'&&!readonly){event.preventDefault();activeCanvasGesture?.();action('undo');return;}if(!readonly&&!current&&!linesHidden&&selected?.type==='edge'&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&['Delete','Backspace'].includes(event.key)){event.preventDefault();deleteSelectedConnection();}});
window.addEventListener('beforeunload',event=>{saveView();const draft=annotationEditor?.querySelector('textarea');if(dirty||pendingImages.size||draft&&draft.value!==(model.annotations.find(a=>a.id===annotationEditorId)?.text||'')){event.preventDefault();event.returnValue='';}});
window.addEventListener('blur',()=>cancelConnection?.());
window.addEventListener('resize',resizePage);
$('#page-viewport').addEventListener('scroll',positionAnnotationEditor,{passive:true});
$('#page-viewport').addEventListener('wheel',event=>{if(event.ctrlKey||event.metaKey){event.preventDefault();event.stopPropagation();zoom(wheelZoomFactor(event.deltaY,zoomSensitivity,event.deltaMode),event);}},{passive:false,capture:true});
$('#zoom-label').onchange=event=>{const percent=Number(event.target.value);if(percent>0)zoom(percent/100/(current?pageScale:camera.scale));};
const sensitivity=$('#zoom-sensitivity');sensitivity.value=zoomSensitivity;$('#zoom-sensitivity-value').value=zoomSensitivity.toFixed(1)+'×';
sensitivity.oninput=()=>{zoomSensitivity=Number(sensitivity.value);$('#zoom-sensitivity-value').value=zoomSensitivity.toFixed(1)+'×';try{localStorage.setItem('yuanxing-zoom-sensitivity',String(zoomSensitivity));}catch{}};

document.addEventListener('pointerdown',event=>{if(annotationEditor&&!event.target.closest('.annotation-editor,.pin,.point-summary,.capture,[data-action="annotate"]'))closeAnnotationEditor();});
document.addEventListener('keyup',event=>{if(event.code==='Space')spacePressed=false;});
window.addEventListener('blur',()=>{spacePressed=false;activeCanvasGesture?.();});
async function refreshSources(){
  if(readonly||document.hidden||dirty||saving||sourceRefreshFlight||pendingImages.size||activeCanvasGesture||cancelConnection||annotationEditorId)return;
  const requestedRevision=revision;sourceRefreshFlight=true;
  try{
    const metadata=await fetch('/api/project/status');if(!metadata.ok)return;const status=await metadata.json();
    if(dirty||saving||revision!==requestedRevision||pendingImages.size||activeCanvasGesture||cancelConnection||annotationEditorId)return;
    if(status.revision===revision&&status.sourceVersion===bundle.sourceVersion)return;
    const r=await fetch('/api/project');if(!r.ok)return;const next=await r.json();
    // 请求发出后可能发生剪切、粘贴及保存；旧响应不能替换更新后的本地状态。
    if(dirty||saving||revision!==requestedRevision||pendingImages.size||activeCanvasGesture||cancelConnection||annotationEditorId||document.activeElement?.matches('input,textarea,[contenteditable]'))return;
    if(next.revision!==revision){model=next.model;revision=next.revision;history.clear();bundle=next;selected=null;if(!node(current))current=null;renderAll();}
    else {next.images={...bundle.images,...next.images};const changed=next.sourcesSignature!==bundle.sourcesSignature;bundle=next;if(changed){positions={};missing.clear();if(current){viewer();renderInspector();}else canvas();}}
  }catch{/* 本地服务暂不可用，已编辑内容留在内存，保存操作负责提示与重试。 */}
  finally{sourceRefreshFlight=false;}
}
$('#experience-flow').onchange=event=>startExperience(event.target.value);
try{if(boot.bundle){bundle=boot.bundle;model=bundle.model;flowContext=clone(model.contextDefaults||{});}else await reload(false);let restored=null;try{restored=restoreView(model,JSON.parse(localStorage.getItem(viewKey())||'null'));}catch{}moduleId=restored?.moduleId||model.entryModule||model.modules[0]?.id;current=restored?.current||null;selected=current?{type:'node',id:current}:null;if(restored){camera=restored.camera||camera;cameras=restored.cameras;flowContext=restored.flowContext;linesHidden=restored.linesHidden;}if(experience)startExperience(boot.flow);else{renderAll();if(!current&&!restored?.camera)fit();}viewReady=true;saveView();if(!readonly){setInterval(refreshSources,3500);}}catch(error){notice('无法打开工作台：'+error.message,[['重试',()=>location.reload()]]);}
</script></body></html>
