<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>分配客户</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#263046;font-size:16px}button,input,select{font:inherit}button{cursor:pointer;padding:11px 20px;border:1px solid #dce1ea;border-radius:6px;background:white;color:#30364a}.primary{background:#535fe8;color:white;border-color:#535fe8}.bar{height:68px;background:white;border-bottom:1px solid #e1e5ec;padding:22px 32px;font-weight:600}.wrap{width:640px;margin:86px auto;background:white;border:1px solid #e1e5ec;border-radius:10px;padding:36px}h1{font-size:26px;margin:0 0 14px}p{color:#778196;line-height:1.8;margin:0 0 26px}.customer{padding:20px;background:#f7f8fb;border-radius:6px;margin:22px 0}label{display:block;margin:24px 0 10px}select{width:100%;padding:12px;border:1px solid #dce1ea;border-radius:6px;background:white}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:36px}.success{width:52px;height:52px;display:grid;place-items:center;background:#ecf8f0;color:#23834c;border-radius:50%;font-size:28px;margin-bottom:20px}.subtle{font-size:14px;color:#778196}[hidden]{display:none!important}</style><body><header class="bar">北辰客户管理</header><main class="wrap"><h1>分配客户</h1><p>为选中的客户指定一位负责成员。</p><div class="customer"><strong>清禾设计</strong><div class="subtle">联系人：林可 · 当前所属成员：待分配</div></div><form><label for="assignee">分配给</label><select id="assignee" data-yx-bind="assignee" required><option value="">请选择成员</option><option>顾言</option><option>许安</option></select><div class="actions"><button type="button" data-yx-id="cancel">取消</button><button type="submit" class="primary" data-yx-id="confirm">确认分配</button></div></form></main></body></html>
