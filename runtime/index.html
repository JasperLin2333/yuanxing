<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>元形工作台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"></head><body>
<header class="toolbar"><div class="toolbar-left"><button class="panel-toggle" data-action="panel-sidebar" aria-controls="sidebar" aria-expanded="true" aria-label="收起模块目录" title="收起模块目录"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><strong id="project-title">元形工作台</strong><select id="project-select" aria-label="切换项目" hidden></select><span id="module-title"></span></div><div id="view-switch" role="group" aria-label="查看方式"><button id="experience-exit" data-action="experience-exit" aria-pressed="true">流程画布</button><button id="experience-start" data-action="experience" aria-pressed="false">完整原型</button></div><div class="toolbar-right"><div id="edit-tools"><button data-action="undo" class="tool-icon" aria-label="撤销" title="撤销（⌘Z / Ctrl+Z）" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12"/></svg></button><button id="annotate-trigger" class="tool-icon" data-action="annotate" aria-label="打点说明" aria-pressed="false" title="打点说明" disabled hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-1 2V11.5a8.5 8.5 0 0 1 17 0Z"/><path d="M8 11h8M12 7v8"/></svg></button></div><div id="experience-tools" hidden><select id="experience-flow" aria-label="选择产品或平台"></select></div><div id="export-menu" class="dropdown"><button data-action="export-menu" id="export-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="export-options">导出 HTML <span aria-hidden="true" class="chevron"></span></button><div id="export-options" class="dropdown-menu" role="menu" aria-label="导出方式" hidden><button role="menuitem" data-action="export-module"><span>当前模块 · 评审工作台</span></button><button role="menuitem" data-action="export-all"><span>整个项目 · 评审工作台</span></button><button role="menuitem" data-action="export-prototype"><span>整个项目 · 独立原型</span></button></div></div><button class="panel-toggle" data-action="panel-inspector" aria-controls="inspector" aria-expanded="true" aria-label="收起页面说明" title="收起页面说明"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button></div></header>
<main class="layout"><nav id="sidebar" aria-label="模块目录"></nav><section id="workspace"><div id="canvas-viewport" tabindex="0" aria-label="模块概览画布"><div id="canvas-world"><div id="canvas-sections"></div><svg id="lines" aria-label="流程连线"></svg><div id="nodes"></div><svg id="alignment-guides" aria-hidden="true"></svg></div></div><p id="recycle-empty" hidden>暂无未显示的内容</p><div id="node-image-menu" class="dropdown-menu editor-only" role="menu" aria-label="图片操作" hidden><button role="menuitem" data-action="replace-image"><span>替换图片</span></button></div><div id="canvas-add-menu" class="dropdown-menu editor-only" role="menu" aria-label="添加节点" hidden><button role="menuitem" data-action="image"><span>添加图片</span></button><button role="menuitem" data-action="note"><span>添加说明节点</span></button></div><div id="viewer" hidden><header class="viewer-toolbar"><button data-action="overview">← 返回概览</button><strong id="viewer-title"></strong><button id="viewer-image-trigger" class="editor-only" data-action="replace-current-image" title="替换图片（也可粘贴新图）" hidden>替换图片</button></header><div id="page-viewport"><div id="page-stage"></div></div></div><div class="zoom-tools"><button id="canvas-add-trigger" data-action="canvas-menu" class="tool-icon editor-only" aria-label="添加节点" title="添加节点" aria-haspopup="menu" aria-expanded="false" aria-controls="canvas-add-menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><span id="canvas-add-divider" class="tool-divider editor-only" aria-hidden="true"></span><button data-action="zoom-out" title="缩小" aria-label="缩小">−</button><select id="zoom-label" aria-label="缩放比例" title="选择缩放比例"><option id="zoom-current" value="custom" hidden selected>100%</option><option value="10">10%</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option><option value="250">250%</option></select><button data-action="zoom-in" title="放大" aria-label="放大">＋</button><button data-action="fit" class="tool-icon" title="适应画布" aria-label="适应画布"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5M3 3l6 6M21 3l-6 6M21 21l-6-6M3 21l6-6"/></svg></button><button data-action="toggle-lines" class="tool-icon" aria-label="隐藏连线" title="隐藏连线" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h8v12h6"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="18" r="2"/><path class="lines-slash" d="M3 21 21 3"/></svg></button><button data-action="delete-edge" class="tool-icon danger editor-only" aria-label="删除连线" title="删除连线（Delete / Backspace）" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button><details class="zoom-settings"><summary aria-label="缩放设置" title="缩放设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/></svg></summary><div class="zoom-settings-panel"><label for="zoom-sensitivity">触控板缩放灵敏度 <output id="zoom-sensitivity-value">3.5×</output></label><input id="zoom-sensitivity" type="range" min="0.5" max="6" step="0.1" value="3.5" aria-label="触控板缩放灵敏度"><div class="zoom-sensitivity-range" aria-hidden="true"><span>0.5×</span><span>6.0×</span></div></div></details></div><div id="message" role="status" hidden></div></section><aside id="inspector" aria-label="页面与操作说明"></aside></main>
<input type="file" id="image-input" accept="image/png,image/jpeg,image/webp" multiple hidden>
<dialog id="image-replace-dialog" aria-labelledby="image-replace-title" aria-describedby="image-replace-description"><h2 id="image-replace-title">替换当前图片？</h2><p id="image-replace-description"></p><footer><button data-action="cancel-image-replacement" autofocus>取消</button><button class="primary" data-action="confirm-image-replacement">替换图片</button></footer></dialog>
<dialog id="image-preview-dialog" aria-labelledby="image-preview-title"><header><button data-action="image-preview-back" autofocus>← 返回</button><strong id="image-preview-title"></strong></header><div id="image-preview-viewport"><div id="image-preview-stage"></div></div></dialog>
<dialog id="branch-dialog"><h2>选择演示分支</h2><div id="branch-options"></div><button data-action="close-branch">取消</button></dialog>
<!-- routing-vendor --><script type="module" src="/app.mjs"></script></body></html>
