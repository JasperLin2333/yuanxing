<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">元形 Yuanxing：人和 AI 共同设计产品的工作台</title>
  <desc id="desc">把产品意图与已有材料组织成共同设计，在流程画布中理解关系，在完整原型中体验结果。团队围绕同一份设计讨论，AI 按明确反馈继续修改。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#33201A"/><stop offset="1" stop-color="#190F0C"/></linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4A2E25"/><stop offset="1" stop-color="#321F19"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#C99E8B" opacity=".16"/></pattern>
  </defs>
  <rect width="1440" height="720" rx="24" fill="url(#bg)"/>
  <rect x="724" y="30" width="686" height="660" fill="url(#grid)"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <g transform="translate(68 58) scale(0.09765625)">
      <rect x="0" y="0" width="512" height="512" rx="128" fill="#FBF7F1"/>
      <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#EBE2D8" stroke-width="3"/>
      <path d="M159 155 H259 Q273 155 273 169 V239 H347 Q362 239 362 254 V347 Q362 362 347 362 H255 Q240 362 240 347 V273 H165 Q150 273 150 258 V170 Q150 155 165 155" fill="none" stroke="#AD624B" stroke-width="29" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M289 238 H341" stroke="#563A32" stroke-opacity=".27" stroke-width="29" stroke-linecap="round"/>
      <circle cx="359" cy="167" r="13" fill="#C38A56" opacity=".82"/>
    </g>
    <text x="137" y="92" fill="#FBF7F1" font-size="30" font-weight="600">元形 <tspan fill="#D1B2A3" font-size="25" letter-spacing="2">YUANXING</tspan></text>
    <text x="68" y="236" fill="#FBF7F1" font-size="66" font-weight="700">想法看得见，</text>
    <text x="68" y="328" fill="#E39D83" font-size="66" font-weight="700">协作接得上。</text>
    <path d="M72 384h60" stroke="#C38A56" stroke-width="4" stroke-linecap="round"/>
    <text x="72" y="445" fill="#D5C4BA" font-size="27">人和 AI 共同设计产品的工作台。</text>
    <text x="72" y="492" fill="#D5C4BA" font-size="27">把意图变成能讨论、能体验的设计。</text>
    <g fill="#ffffff" fill-opacity=".04" stroke="#6B4D42">
      <rect x="68" y="585" width="181" height="54" rx="27"/>
      <rect x="264" y="585" width="181" height="54" rx="27"/>
      <rect x="460" y="585" width="181" height="54" rx="27"/>
    </g>
    <g fill="#DECBC0" font-size="22" text-anchor="middle">
      <text x="158" y="619">表达意图</text><text x="354" y="619">共同体验</text><text x="550" y="619">继续迭代</text>
    </g>
    <g fill="#36221B" stroke="#785447">
      <rect x="780" y="157" width="240" height="98" rx="14"/>
      <rect x="1080" y="157" width="240" height="98" rx="14"/>
    </g>
    <g fill="#F4EAE3" text-anchor="middle" font-size="29" font-weight="600">
      <text x="900" y="217">产品意图</text><text x="1200" y="217">已有材料</text>
    </g>
    <g stroke="#B88B78" stroke-width="2" fill="none">
      <path d="M900 255v48h300v-48M1050 303v31m-6-8 6 8 6-8"/>
      <path d="M1050 445v38H900v25m-6-8 6 8 6-8M1050 483h150v25m-6-8 6 8 6-8"/>
    </g>
    <rect x="780" y="343" width="540" height="102" rx="18" fill="url(#project)" stroke="#BA846E"/>
    <text x="1050" y="386" text-anchor="middle" fill="#FBF7F1" font-size="31" font-weight="600">可共同讨论的设计</text>
    <text x="1050" y="420" text-anchor="middle" fill="#D5B5A7" font-size="23">意图 · 流程 · 页面 · 说明</text>
    <rect x="780" y="517" width="240" height="93" rx="14" fill="#FBF7F1"/>
    <rect x="1080" y="517" width="240" height="93" rx="14" fill="#C97E65"/>
    <g text-anchor="middle" fill="#3A241D">
      <text x="900" y="555" font-size="28" font-weight="600">流程画布</text><text x="900" y="588" font-size="21">理解关系与条件</text>
      <text x="1200" y="555" font-size="28" font-weight="600" fill="#FFF8F3">完整原型</text><text x="1200" y="588" font-size="21" fill="#FCEEE7">体验过程与结果</text>
    </g>
    <text x="1050" y="661" text-anchor="middle" fill="#C5ABA0" font-size="22">围绕同一份设计讨论，让反馈进入下一次修改</text>
  </g>
</svg>
